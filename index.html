<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>New Tab | Evergreen</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Italianno&display=swap" rel="stylesheet">
    <body>
        <div style="margin-top: 98px;">
            <h3>EvergreenTab</h3>
            <h1 id="local-time">12:00</h1>
            <h3 id="local-date">Sunday, January 1</h3>
            <div style="margin-top: -16px; display: flex; flex-direction: row; justify-content: center; align-items: center;">
                <div class="dropdown">
                    <button id="dropdown-button" class="dropdown-button">
                        <img src="icons/google-icon.svg" id="engine-image" class="engine-image">
                    </button>
                    <div id="dropdown-content" class="dropdown-content transparent">
                        <button class="engine-selector" name="google">
                            <img src="icons/google-icon.svg">
                            <span>Google</span>
                        </button>
                        <button class="engine-selector" name="bing">
                            <img src="icons/bing-icon.svg">
                            <span>Bing</span>
                        </button>
                        <button class="engine-selector" name="duckduckgo">
                            <img src="icons/duckduckgo-icon.svg">
                            <span>DuckDuckGo</span>
                        </button>
                        <button class="engine-selector" name="brave">
                            <img src="icons/brave-icon.svg">
                            <span>Brave</span>
                        </button>
                        <button class="engine-selector" name="yahoo">
                            <img src="icons/yahoo-icon.svg">
                            <span>Yahoo</span>
                        </button>
                    </div>
                </div>
                <form id="search-bar" action="https://google.com/search" method="get" style="max-width: 80v; display: flex; flex-direction: row; justify-content: center; align-items: center;">
                    <input class="search-bar" type="search" id="search-tab" placeholder="Search the web..." name="q" autocomplete="off" required>
                    <button class="search-button" type="submit">
                        <img src="icons/search-icon.png" class="engine-image">
                    </button>
                </form>
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
